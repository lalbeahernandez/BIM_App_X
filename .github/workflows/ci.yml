name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/verify_harness.py

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: bim, POSTGRES_PASSWORD: bim, POSTGRES_DB: bim}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bim -d bim" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r services/api/requirements.txt
      - run: ruff check services/api/app services/api/tests
      - run: mypy services/api/app
      # Integration DB schema is validated in Docker Compose/nightly because CI service image here is plain PostgreSQL.

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package.json}
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
